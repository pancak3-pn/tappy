            "name": "What is a Tappy NFC Card?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A Tappy NFC Card is a reusable digital business card that uses NFC (Near Field Communication) technology. When tapped against an NFC-enabled smartphone, it instantly opens your digital profile — no app required. It also includes a printed QR code as a backup for phones without active NFC."
            }
          },
          {
            "@type": "Question",
            "name": "How does Tappy work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Simply tap your Tappy card on any NFC-enabled smartphone. Your digital profile opens instantly in the phone's browser, showing your contact details, social media links, Google Reviews, booking links, and more. No app is needed on either end."
            }
          },
          {
            "@type": "Question",
            "name": "Does the recipient need an app to view my Tappy profile?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Recipients do not need to download any app. Your Tappy page opens directly in their phone's browser after a tap or QR scan."
            }
          },
          {
            "@type": "Question",
            "name": "How much does a Tappy NFC Card cost in the Philippines?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tappy NFC Cards start at ₱199 as a one-time purchase. Delivery fees vary by location: ₱80 for Luzon, ₱100 for Visayas, and ₱120 for Mindanao."
            }
          },
          {
            "@type": "Question",
            "name": "Can I update my Tappy profile after purchase?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Your Tappy profile can be updated anytime through a secure private link. Changes go live on your public page instantly — no need to replace the card."
            }
          },
          {
            "@type": "Question",
            "name": "What information can I share on my Tappy page?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can share your name, photo, role or headline, bio, phone number, email, location, and up to 8 links including Facebook, Instagram, LinkedIn, Google Reviews, Google Maps, a booking link, portfolio, or website."
            }
          },
          {
            "@type": "Question",
            "name": "Does Tappy ship nationwide in the Philippines?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Tappy ships to all provinces across Luzon, Visayas, and Mindanao."
