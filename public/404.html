<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#f3f2ed">
    <link rel="icon" type="image/png" href="/assets/app-icon.png">
    <title>Page not found | Tappy</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        padding: 48px 24px 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #151515;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .card {
        max-width: 480px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        font-size: clamp(5.5rem, 15vw, 8.5rem);
        font-weight: 850;
        line-height: 1;
        letter-spacing: -0.05em;
        margin: 0 0 16px;
      }
      h2 {
        font-size: clamp(1.4rem, 4vw, 1.75rem);
        font-weight: 750;
        letter-spacing: -0.03em;
        margin: 0 0 14px;
      }
      p {
        font-size: 1rem;
        line-height: 1.55;
        color: #53534f;
        margin: 0 0 30px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #151515;
        color: #ffffff;
        padding: 13px 36px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(21, 21, 21, 0.1);
        transition: transform 0.18s ease, background 0.18s ease;
      }
      a:hover {
        background: #244a3a;
        transform: translateY(-2px);
      }
      .img-wrap {
        margin-top: 48px;
        width: min(220px, 70vw);
      }
      .img-wrap img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <h2>Page not found.</h2>
      <p>The link you followed may be broken,<br>or the page may have been removed.</p>
      <a href="/">Go Home</a>
      <div class="img-wrap">
        <img src="/assets/404.png" alt="Page not found">
      </div>
    </main>
  </body>
</html>
